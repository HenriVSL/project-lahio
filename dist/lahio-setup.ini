; Setup98 manifest for Project Lähiö (DRAFT: Setup98 is not 1.0 yet; check keys against dev/setup98/README.md).
; Packages the staged release folder dist/LAHIO (made by dist/package.sh, same files as the portable zip).
; Mac:  ~/Documents/86box/Shared/dev/setup98/<pack98> dist/lahio-setup.ini

[Product]
Id=ProjectLahio
Name=Project Lähiö
; lahio.exe has no version resource; package.sh rewrites this line
Version=1.2
Publisher=Henri Lavikainen
MainExe=lahio.exe
Folder=%ProgramFiles%\Project Lahio
Description=Project Lähiö is an isometric sandbox city builder for Windows 98. Build a Finnish town from 1955: wooden rintamamiestalo suburbs, concrete lähiö estates, power, water and politics. You are the President.\n\nNeeds DirectX 6.1 or later, a DirectDraw card with 16 MB video memory and an 800 x 600 16-bit display.
Readme=README.TXT
Run=1
; src/plat.cpp WNDCLASS_NAME: Setup refuses to replace files while the game runs
WindowClass=Lahio98
DataName=your saved towns, settings and logs
URL=https://github.com/HenriVSL/project-lahio

[Files]
Source=LAHIO
File=lahio.exe
File=README.TXT
File=art\*.bmp
File=sfx\*.wav
; written by the game (next to the exe): never shipped, deleted only when the user asks
UserData=*.KAU
UserData=LAHIO.INI
UserData=KAUPUNKI.INI
UserData=*.log
UserData=shot*.bmp
UserData=bench.txt

[Shortcuts]
StartMenu=1
Desktop=0
Group=Project Lahio
Link=Project Lähiö | lahio.exe | desc=Finnish town builder, 1955-1990
Link=Project Lähiö (window) | lahio.exe | args=-window | desc=Project Lähiö in a window
Link=Read me | README.TXT
Link=Uninstall Project Lähiö | uninst.exe
DesktopLink=Project Lähiö | lahio.exe | desc=Finnish town builder, 1955-1990

[Requires]
DirectX=6
Windows=98

[Pack]
OutFile=out/lahio-1.2-setup.exe
